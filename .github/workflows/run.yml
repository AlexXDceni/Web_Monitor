name: Check Webpage Updates

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Run tracking script
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python script.py

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Adăugăm fișierul în staging area
          git add last_hash.txt
          
          # Verificăm dacă fișierul s-a schimbat cu adevărat
          if ! git diff --cached --quiet; then
            git commit -m "Update page hash cache"
            # Facem push direct pe branch-ul care a declanșat acțiunea
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "Nu s-a detectat nicio schimbare în last_hash.txt. Skip push."
          fi
